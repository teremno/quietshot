[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quietshot"
version = "0.2.2"
description = "A small, high-resolution screenshot tool with a floating button."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PySide6-Addons>=6.11,<6.12", "pynput>=1.7,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]
package = ["pyinstaller>=6.10,<7"]

[project.scripts]
quietshot = "quietshot.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

