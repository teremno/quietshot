name: Package installers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'installers/**'
      - 'pyproject.toml'
      - '.github/workflows/package.yml'

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-22.04
            name: linux-x64
          - os: macos-15
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libpulse0 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1 libxcb-icccm4
      - run: python -m pip install -e ".[dev,package]"
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name QuietShot --specpath build src/quietshot/__main__.py
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bad = Get-ChildItem 'dist/QuietShot/_internal' -Filter 'icuuc.dll' -Recurse -ErrorAction SilentlyContinue
          if ($bad) { throw "Unexpected ICU DLL bundled: $($bad.FullName)" }
      - if: runner.os == 'Linux'
        run: QT_QPA_PLATFORM=offscreen dist/QuietShot/QuietShot --self-test
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath (Resolve-Path 'dist/QuietShot/QuietShot.exe') -ArgumentList '--self-test' -PassThru -WindowStyle Hidden
          try { Wait-Process -Id $process.Id -Timeout 30 }
          catch { Stop-Process -Id $process.Id -Force; throw 'Frozen app self-test timed out' }
          if ($process.ExitCode -ne 0) { throw "Frozen app self-test failed: $($process.ExitCode)" }
      - if: runner.os == 'macOS'
        run: QT_QPA_PLATFORM=offscreen dist/QuietShot.app/Contents/MacOS/QuietShot --self-test
      - if: runner.os == 'Linux'
        run: bash installers/build-linux.sh
      - if: runner.os == 'macOS'
        run: QUIETSHOT_ARCH=${{ matrix.name == 'macos-arm64' && 'arm64' || 'x64' }} bash installers/build-macos.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $compiler = Get-ChildItem 'C:\Program Files*\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $compiler) { throw 'Inno Setup compiler not found' }
          & $compiler /DAppVersion=0.2.2 installers/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compile failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: quietshot-${{ matrix.name }}
          path: release/*
          if-no-files-found: error
